version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Persist the SQLite database (servers + sessions + poll config) across restarts:
      - ixse_db:/app/data
    environment:
      # Optional: override the default 60-second poll interval at startup.
      # Can also be changed at runtime via PATCH /poll/config in the UI.
      - IXSE_POLL_INTERVAL=${IXSE_POLL_INTERVAL:-60}
      - IXSE_DB=/app/data/ixse.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ixse_db:
