version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Mount your config file (required):
      - ./backend/ixse_config.yaml:/app/ixse_config.yaml:ro
      # Persist the SQLite database across restarts (optional):
      - ixse_db:/app/data
    environment:
      # Credentials via env vars — set before running docker compose up
      # e.g.: export IXNET_PASSWORD=secret
      - IXNET_PASSWORD=${IXNET_PASSWORD:-}
      - IXOS_PASSWORD=${IXOS_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ixse_db:
