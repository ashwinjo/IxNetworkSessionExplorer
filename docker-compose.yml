services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${IXSE_BIND_ADDR:-0.0.0.0}:8080:8080"
    volumes:
      # Persist the SQLite database (servers + sessions + poll config) across restarts:
      - ixse_db:/app/data
    environment:
      # Optional: override the default 60-second poll interval at startup.
      # Can also be changed at runtime via PATCH /poll/config in the UI.
      - IXSE_POLL_INTERVAL=${IXSE_POLL_INTERVAL:-60}
      - IXSE_DB=/app/data/ixse.db
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: nginx:alpine
    ports:
      - "${IXSE_BIND_ADDR:-0.0.0.0}:3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    ports:
      - "${IXSE_BIND_ADDR:-0.0.0.0}:8889:8889"
    environment:
      # Points at the backend container via the internal compose network.
      # Override with IXNSE_API_URL if running a remote backend.
      - IXNSE_API_URL=${IXNSE_API_URL:-http://backend:8080}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ixse_db:
