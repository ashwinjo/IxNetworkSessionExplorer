[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ixse"
version = "0.1.0"
description = "IxNetwork Session Explorer - unified session manager for lab administrators"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Network Automation Team", email = "team@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "fastapi >= 0.110.0",
    "uvicorn[standard] >= 0.23.0",
    "ixnetwork-restpy >= 1.0.0",
    "pydantic >= 2.0.0",
    "pyyaml >= 6.0.0",
    "requests >= 2.31.0",
    "prometheus-client >= 0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.0.0",
    "pytest-asyncio >= 0.21.0",
    "pytest-cov >= 4.0.0",
    "httpx >= 0.27.0",
    "black >= 23.0.0",
    "ruff >= 0.1.0",
    "mypy >= 1.0.0",
    "types-PyYAML",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/yourusername/IxNetworkSessionExplorer"
Repository = "https://github.com/yourusername/IxNetworkSessionExplorer"
Issues = "https://github.com/yourusername/IxNetworkSessionExplorer/issues"

[tool.setuptools]
# Automatically discover all packages and subpackages
[tool.setuptools.packages.find]
where = ["."]
include = ["ixse*"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "ARG001", # unused function argument (often false positives in callbacks)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused (for re-exports)
"tests/*" = ["ARG001"]    # test functions may have unused arguments

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=ixse --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
