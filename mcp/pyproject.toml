[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ixnse-mcp"
version = "0.1.0"
description = "MCP server for IxNetwork Session Explorer"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
ixnse-mcp = "ixnse_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
